<label class="calc-field__label" [attr.for]="selectId()">{{ label() }} <span class="red">
  {{required() === true ? '*': ''}}
</span></label>

<div class="calc-field__control" [class.is-invalid]="invalid()">
  <select
    class="calc-field__input"
    [id]="selectId()"
    [disabled]="disabled()"
    [value]="value()"
    [attr.aria-invalid]="invalid()"
    [attr.aria-describedby]="describedById()"
    (change)="handleChange($event)"
    (blur)="handleBlur()"
  >
    <option value="" disabled>{{ placeholder() }}</option>
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</div>

@if (hint()) {
  <p class="calc-field__hint" [id]="selectId() + '-hint'">{{ hint() }}</p>
}

@if (invalid() && errorText()) {
  <p class="calc-field__error" [id]="selectId() + '-error'">{{ errorText() }}</p>
}
